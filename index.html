<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Игри от Meivi</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FBF1F0">
<link rel="icon" href="logo-ink.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Golos+Text:wght@400;500;700&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Meivi games, modern: soft blush canvas, white floating surfaces, colour-rich game covers, one share poster. */
  color-scheme: light;
  --bg:#FBF1F0;
  --surface:#FFFFFF;
  --ink:#1F1F1F;
  --muted:#7A6767;
  --line:#F0DFDE;
  --hot:#B12A29;
  --coral:#EF8F61;
  --gold:#C2611F;
  --mint:#1E7F6B;
  --lilac:#6B4FB3;
  --sky:#1F6FB5;
  --sh:0 14px 34px -16px rgba(122,40,38,.38), 0 2px 6px rgba(122,40,38,.06);
  --display:"Unbounded","Golos Text",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --hand:"Caveat","Segoe Script",cursive;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:
    radial-gradient(70% 38% at 100% 0%, #FFDDD0 0, transparent 70%) fixed,
    radial-gradient(60% 32% at 0% 14%, #F7D6E2 0, transparent 70%) fixed,
    var(--bg);
  color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
}
#app{max-width:480px;min-height:100%;margin:0 auto;padding:20px 18px 36px;display:flex;flex-direction:column;gap:22px}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance;color:var(--ink)}
h1{font-size:26px;font-weight:800;line-height:1.12;letter-spacing:-.01em}
h2{font-size:15px;font-weight:600;line-height:1.2}
p{margin:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.c-hot{--m:var(--hot)} .c-gold{--m:var(--gold)} .c-mint{--m:var(--mint)} .c-lilac{--m:var(--lilac)} .c-sky{--m:var(--sky)}

.btn{
  border:0;border-radius:999px;padding:15px 22px;min-height:56px;font-weight:700;font-size:17px;color:#fff;
  background:linear-gradient(180deg,#CB3A33,#A92423);box-shadow:0 14px 24px -12px rgba(177,42,41,.75), inset 0 1px 0 rgba(255,255,255,.25);
  transition:transform .1s;
}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:var(--sh)}
.btn.small{min-height:40px;padding:8px 15px;font-size:14px;flex:none}
.row{display:flex;gap:10px}
.row > *{flex:1}
.stack{display:flex;flex-direction:column;gap:12px}
.note{color:var(--muted);font-size:14px}
.brand{font-family:var(--hand);font-weight:700;font-size:25px;line-height:1;color:var(--hot)}
.logo{display:block;width:120px;height:auto}
.logo.sm{width:66px}
.req{font-size:13px;font-weight:700;color:#8A3A12;background:#FDE3D6;border-radius:999px;padding:5px 12px;white-space:nowrap}
.headrow{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.cnt{font-size:13px;color:var(--muted);font-weight:500;white-space:nowrap}

/* Home */
.hero{align-items:center;text-align:center;gap:8px}
.hero .logo{margin:0 auto}
.hero h1{margin-top:6px}
.cats{display:flex;gap:8px;overflow-x:auto;margin:0 -18px;padding:4px 18px 10px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{
  flex:none;border:0;border-radius:999px;background:var(--surface);box-shadow:var(--sh);padding:10px 16px;font-weight:700;font-size:14px;white-space:nowrap;
}
.cats button:active{transform:scale(.96)}
.shelf{display:flex;flex-direction:column;gap:12px;scroll-margin-top:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{
  position:relative;text-align:left;border:0;border-radius:24px;padding:14px;min-height:132px;overflow:hidden;
  background:linear-gradient(155deg, color-mix(in srgb, var(--m) 17%, #fff) 0%, #fff 72%);
  box-shadow:var(--sh);display:flex;flex-direction:column;justify-content:space-between;gap:14px;transition:transform .1s;
}
.tile:active{transform:scale(.97)}
.tile .ico{
  width:50px;height:50px;border-radius:17px;display:grid;place-items:center;font-size:27px;line-height:1;
  background:color-mix(in srgb, var(--m) 20%, #fff);
}
.tile .tx{display:flex;flex-direction:column;gap:5px}
.tile b{font-family:var(--display);font-weight:600;font-size:14.5px;line-height:1.22;overflow-wrap:anywhere}
.tile small{font-size:12.5px;color:var(--muted);font-weight:500}
.tile .age{font-style:normal;font-weight:700;color:var(--hot)}
.tile.big{
  grid-column:1/-1;flex-direction:row-reverse;align-items:flex-end;min-height:158px;padding:20px;color:#fff;
  background:
    radial-gradient(90% 120% at 100% 0%, color-mix(in srgb, var(--m) 55%, #FFC2A6) 0, transparent 62%),
    linear-gradient(150deg, var(--m), color-mix(in srgb, var(--m) 64%, #000));
  box-shadow:0 22px 36px -20px color-mix(in srgb, var(--m) 80%, #000);
}
.tile.big .ico{width:72px;height:72px;border-radius:24px;font-size:40px;background:rgba(255,255,255,.2);flex:none;align-self:flex-start}
.tile.big .tx{flex:1;min-width:0}
.tile.big b{font-size:19px;font-weight:800}
.tile.big .d{font-size:14px;line-height:1.35;opacity:.92}
.tile.big small{color:rgba(255,255,255,.85)}
.tile.big .age{color:#fff;background:rgba(255,255,255,.22);padding:1px 7px;border-radius:999px}
.grid .tile:last-child:nth-child(even){grid-column:1/-1;min-height:0;flex-direction:row;align-items:center;justify-content:flex-start}
.soon{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.soon b{font-weight:700;margin-right:2px}
.soon span{background:rgba(255,255,255,.7);border:1px dashed #DDBFBE;border-radius:999px;padding:4px 10px}

/* Setup */
.ghead{gap:8px}
.ico.lg{width:64px;height:64px;border-radius:22px;display:grid;place-items:center;font-size:34px;background:color-mix(in srgb, var(--m) 18%, #fff);box-shadow:var(--sh)}
.seg{display:flex;gap:4px;background:var(--surface);box-shadow:var(--sh);padding:5px;border-radius:999px}
.seg button{flex:1;border:0;border-radius:999px;background:transparent;padding:10px 6px;min-height:42px;font-weight:500;font-size:15px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:var(--surface);box-shadow:var(--sh);padding:6px 6px 6px 15px;font-weight:700;max-width:100%}
.chip.first{background:#FDE3D6}
.chip > span,.chip .nm{overflow-wrap:anywhere}
.chip .nm{border:0;background:none;padding:0;text-align:left;font-weight:700}
.chip button:not(.nm){border:0;background:#F4E6E5;color:var(--muted);width:28px;height:28px;border-radius:50%;font-size:16px;line-height:1;flex:none}
.add{display:flex;gap:8px}
.add input{flex:1;min-width:0;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);padding:12px 18px;min-height:50px}
.add input:focus{outline:none;border-color:var(--hot)}
.add input::placeholder{color:#A99494}
.how{background:rgba(255,255,255,.72);border-radius:20px;padding:14px 16px;font-size:15px;color:#4A3D3D}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{
  text-align:left;border:2px solid transparent;border-radius:20px;padding:12px 14px;min-height:70px;background:var(--surface);box-shadow:var(--sh);
  display:flex;flex-direction:column;gap:3px;opacity:.55;
}
.mode b{font-family:var(--display);font-weight:600;font-size:13.5px;color:var(--m)}
.mode small{color:var(--muted);font-size:12.5px;line-height:1.3}
.mode[aria-pressed="true"]{opacity:1;border-color:var(--m);background:color-mix(in srgb, var(--m) 8%, #fff)}

.seg.times{border-radius:26px}
.seg.times button{display:flex;flex-direction:column;align-items:center;gap:1px;border-radius:21px;padding:9px 4px 10px}
.seg.times b{font-size:17px;font-weight:700;line-height:1.1}
.seg.times small{font-size:11.5px;font-weight:500;line-height:1.2;opacity:.8}
/* Play */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.top .count{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700;text-align:center}
.bar{height:8px;border-radius:999px;background:#F1DEDD;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--hot),var(--coral))}
.deck{position:relative;margin:30px 0 10px}
.deck::before,.deck::after{content:"";position:absolute;inset:10px 10px 0;border-radius:30px;background:#fff}
.deck::before{transform:rotate(3deg) translateY(6px);opacity:.75;box-shadow:var(--sh)}
.deck::after{transform:rotate(-3.5deg) translateY(9px);opacity:.45}
.card{
  position:relative;z-index:1;color:var(--ink);border-radius:30px;padding:22px 22px 24px;min-height:290px;
  display:flex;flex-direction:column;gap:14px;
  background:linear-gradient(180deg, color-mix(in srgb, var(--m, var(--hot)) 13%, #fff) 0, #fff 46%);
  box-shadow:0 30px 50px -26px color-mix(in srgb, var(--m, var(--hot)) 70%, #000), 0 2px 8px rgba(122,40,38,.08);
  transform:rotate(var(--tilt,-1.2deg));
  animation:deal .46s cubic-bezier(.2,.9,.3,1.15) both, float 4.6s ease-in-out .5s infinite alternate;
}
.card > :last-child{padding-right:62px}
.card::after{content:"";position:absolute;bottom:14px;right:18px;width:46px;height:36px;background:url(logo-ink.png) center/contain no-repeat;opacity:.9}
.card .tag{
  align-self:flex-start;font-family:var(--display);font-weight:600;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;
  background:var(--m);color:#fff;padding:8px 14px;border-radius:999px;
}
.card .heat{position:absolute;top:30px;right:24px;display:flex;gap:5px}
.card .heat i{width:11px;height:11px;border-radius:50%;background:color-mix(in srgb, var(--m) 22%, #fff)}
.card .heat i.on{background:var(--m)}
.card .who{font-weight:500;font-size:15px;color:var(--muted)}
.card .who b{color:var(--ink);font-size:18px;font-weight:700}
.card .lead{font-weight:700;color:var(--muted);font-size:16px}
.card .q{font-size:25px;line-height:1.22;font-weight:700;letter-spacing:-.01em;text-wrap:balance;margin:auto 0;overflow-wrap:anywhere}
.card .q u{text-decoration:none;color:var(--m);background:color-mix(in srgb, var(--m) 12%, #fff);border-radius:8px;padding:0 6px}
.card .rule{font-size:13.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.card .ans{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:10px}
.card .ans span{color:var(--muted);font-weight:500;overflow-wrap:anywhere}
.card .ans b{text-align:right;overflow-wrap:anywhere}
.verdict{font-family:var(--display);font-weight:800;font-size:20px}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick button{border:0;border-radius:999px;padding:10px 17px;min-height:46px;font-weight:700;background:var(--surface);box-shadow:var(--sh);overflow-wrap:anywhere}
.pick button[aria-pressed="true"]{background:var(--ink);color:#fff}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{
  text-align:left;border:2px solid transparent;border-radius:20px;padding:14px 18px;min-height:54px;font-weight:700;font-size:16px;
  background:var(--surface);box-shadow:var(--sh);overflow-wrap:anywhere;color:var(--ink);
}
.opt:active{transform:scale(.98)}
.opt.ok{background:var(--mint);color:#fff}
.opt.bad{background:#FCEBEA;border-color:#EDB7B5;color:var(--hot);text-decoration:line-through;box-shadow:none}
.opt[disabled]{cursor:default}
.flash{min-height:22px;text-align:center;font-weight:700;color:var(--hot);font-size:15px}
.cover{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;text-align:center;min-height:340px}
.cover b{font-family:var(--display);font-weight:800;font-size:34px;color:var(--hot);overflow-wrap:anywhere}

/* Scores */
table{width:100%;border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;background:var(--surface);border-radius:22px;box-shadow:var(--sh);overflow:hidden}
th,td{padding:12px 14px;text-align:right;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th:first-child,td:first-child{text-align:left;overflow-wrap:anywhere;font-weight:700}
th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.sheet{position:fixed;inset:0;background:rgba(31,31,31,.5);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sheet > div{width:100%;max-width:480px;max-height:85%;overflow:auto;background:var(--bg);border-radius:30px 30px 0 0;padding:24px 18px 26px;display:flex;flex-direction:column;gap:16px}

/* Share poster */
.poster{
  position:relative;overflow:hidden;border-radius:34px;padding:24px 22px 22px;min-height:540px;color:#fff;
  display:flex;flex-direction:column;gap:18px;
  background:
    radial-gradient(95% 60% at 100% 0%, color-mix(in srgb, var(--m) 50%, #FFC2A6) 0, transparent 62%),
    radial-gradient(80% 50% at 0% 100%, color-mix(in srgb, var(--m) 55%, #000) 0, transparent 70%),
    linear-gradient(160deg, var(--m), color-mix(in srgb, var(--m) 66%, #000));
  box-shadow:0 34px 60px -28px color-mix(in srgb, var(--m) 80%, #000);
  animation:deal .5s cubic-bezier(.2,.9,.3,1.15) both;--tilt:0deg;
}
.poster::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:
    radial-gradient(circle at 12% 30%, #fff 0 3px, transparent 4px), radial-gradient(circle at 88% 44%, #FFD9B8 0 4px, transparent 5px),
    radial-gradient(circle at 70% 16%, #fff 0 2px, transparent 3px), radial-gradient(circle at 24% 78%, #FFD9B8 0 3px, transparent 4px),
    radial-gradient(circle at 92% 82%, #fff 0 2px, transparent 3px), radial-gradient(circle at 48% 8%, #FFD9B8 0 2px, transparent 3px);
}
.poster > *{position:relative}
.phead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.plogo{background:#fff;border-radius:20px;padding:9px 12px 7px;box-shadow:0 10px 22px -12px rgba(0,0,0,.55)}
.phead .logo{width:60px}
.phead span{font-family:var(--hand);font-weight:700;font-size:24px;line-height:1}
.pgame{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.17);border:1px solid rgba(255,255,255,.3);padding:8px 15px;border-radius:999px;font-weight:700;font-size:14.5px}
.phero{margin:auto 0;display:flex;flex-direction:column;gap:10px}
.plabel{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.88}
.pname{font-family:var(--display);font-weight:800;font-size:46px;line-height:1.02;letter-spacing:-.02em;overflow-wrap:anywhere;text-wrap:balance}
.pname.long{font-size:30px;line-height:1.1}
.ring{position:relative;width:204px;height:204px;border-radius:50%;margin:0 auto;display:grid;place-items:center;background:conic-gradient(#fff calc(var(--p) * 1%), rgba(255,255,255,.22) 0)}
.ring::before{content:"";position:absolute;inset:15px;border-radius:50%;background:color-mix(in srgb, var(--m) 78%, #000)}
.ring > *{position:relative;grid-area:1/1;text-align:center}
.ring b{font-family:var(--display);font-weight:800;font-size:50px;line-height:1;margin-top:-14px}
.ring span{font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.88;margin-top:52px}
.ptitle{font-family:var(--display);font-weight:800;font-size:23px;line-height:1.15;text-align:center;text-wrap:balance}
.pnames{text-align:center;font-weight:700;font-size:17px;opacity:.95;overflow-wrap:anywhere}
.pnames i{font-family:var(--hand);font-style:normal;font-size:22px;opacity:.9}
.podium{display:flex;align-items:flex-end;gap:10px;min-height:210px}
.podium .p{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:7px}
.podium .pn{font-weight:700;font-size:15px;text-align:center;overflow-wrap:anywhere;line-height:1.2}
.podium .cr{font-size:26px;line-height:1}
.podium i{display:grid;place-items:center;width:100%;border-radius:18px 18px 8px 8px;background:rgba(255,255,255,.2);font-style:normal;font-family:var(--display);font-weight:800;font-size:24px}
.podium .p1 i{height:124px;background:#fff;color:var(--m)}
.podium .p2 i{height:88px}
.podium .p3 i{height:62px}
.pchips{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pchips > div{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.24);border-radius:20px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.pchips > :last-child:nth-child(odd){grid-column:1/-1}
.pchips span{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.pchips b{font-family:var(--display);font-weight:600;font-size:15.5px;line-height:1.2;overflow-wrap:anywhere}
.prank{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22);border-radius:20px;padding:6px 14px;font-variant-numeric:tabular-nums}
.pr{display:grid;grid-template-columns:minmax(0,1fr) repeat(var(--c),58px);align-items:center;gap:6px;padding:9px 0;border-top:1px solid rgba(255,255,255,.16);font-weight:700;font-size:15px}
.pr > span{text-align:right}
.pr > span:first-child{text-align:left;display:flex;align-items:center;gap:9px;overflow-wrap:anywhere;min-width:0}
.pr i{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.2);font-style:normal;font-size:12.5px}
.pr:nth-child(2) i{background:#fff;color:var(--m)}
.pr.ph{border-top:0;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;opacity:.85;padding:8px 0 6px}
.pfoot{text-align:center;font-size:14px;opacity:.92}
.pfoot b{font-weight:700}

/* Motion */
@keyframes deal{
  0%{transform:translate(75%,-8%) rotate(18deg) scale(.9);opacity:0}
  65%{transform:translate(-3%,0) rotate(-4deg) scale(1.01);opacity:1}
  100%{transform:rotate(var(--tilt,-1.2deg))}
}
@keyframes float{from{transform:rotate(var(--tilt,-1.2deg)) translateY(0)}to{transform:rotate(calc(var(--tilt,-1.2deg) * .3)) translateY(-5px)}}
.card.out{animation:out .2s ease-in forwards}
@keyframes out{to{transform:translate(-85%,8%) rotate(-20deg);opacity:0}}
.card::before{
  content:"";position:absolute;right:28px;top:-28px;width:74px;height:36.7px;
  background:url(logo-ink.png) -15.6px -1.7px/105.4px auto no-repeat;
  animation:peek .5s cubic-bezier(.3,1.4,.5,1) .45s both, bob 2.8s ease-in-out 1.2s infinite alternate;
}
@keyframes peek{from{clip-path:inset(100% 0 0 0);transform:translateY(60%)}to{clip-path:inset(0);transform:none}}
@keyframes bob{from{transform:translateY(0) rotate(0)}to{transform:translateY(-3px) rotate(-3deg)}}
.card > *{animation:rise .36s ease-out both}
.card > :nth-child(1){animation-delay:.16s}
.card > :nth-child(2){animation-delay:.22s}
.card > :nth-child(3){animation-delay:.28s}
.card > :nth-child(4){animation-delay:.34s}
.card > :nth-child(n+5){animation-delay:.4s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes stamp{0%{opacity:0;transform:scale(1.5)}70%{opacity:1;transform:scale(.95)}100%{transform:none}}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.07)}100%{transform:none}}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.pick button[aria-pressed="true"]{animation:pop .22s ease-out}
.opt.ok{animation:pop .3s ease-out}
.opt.bad{animation:shake .32s ease-in-out}
.verdict{animation:stamp .4s ease-out .5s both}
.cover b{animation:pop .35s ease-out}
.phero{animation:stamp .5s ease-out .35s both}
.pchips > div{animation:rise .35s ease-out both}
.pchips > :nth-child(1){animation-delay:.5s} .pchips > :nth-child(2){animation-delay:.6s} .pchips > :nth-child(3){animation-delay:.7s} .pchips > :nth-child(4){animation-delay:.8s}

  0%{transform:translate(0,0) scale(.5);opacity:1}
  55%{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:1}

  .card,.card::before,.card > *,.pick button,.opt,.verdict,.cover b,.poster,.phero,.pchips > div{animation:none !important}

}

function poolOf(g){

let S = {screen:"home", g:null, rounds:15, level:2, kinds:{A:true,V:true,Q:true,D:true}, drink:true, players:[], deck:[], i:0, stats:[], sel:[], flash:"",

const rand = n => Math.floor(Math.random()*n);
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=rand(i+1);[a[i],a[j]]=[a[j],a[i]];} return a; };
const game = () => GAMES.find(g => g.id === S.g);

const plural = n => n === 1 ? "играч" : "играчи";

    if(Array.isArray(v) && v.length) S.players = v.slice(0,12).map(String).filter(x => !/^Играч \d+$/.test(x));

}

/* ---------- Подготовка на тесте ---------- */
function begin(){
  const g = game(), n = S.players.length;
  S.i = 0; S.sel = []; S.flash = ""; S.sheet = false; S.copied = false; S.picked = null; S.answered = 0;
  S.stats = S.players.map(() => ({a:0,b:0,pass:0}));
  if(g.eng === "cards"){
    let deck = poolOf(g).map(([k,t,l]) => ({k,t,l}));
    const R = Math.min(S.rounds, deck.length);
    if(g.ordered) deck = Array.from({length:R}, (_,i) => deck[R > 1 ? Math.round(i*(deck.length-1)/(R-1)) : 0]);
    else deck = shuffle(deck).slice(0, R);
    let turn = g.ordered ? 0 : rand(n);
    deck.forEach(c => {
      if(c.k==="Q" || c.k==="D"){
        c.p = turn % n; turn++;
        let o = rand(n-1); if(o >= c.p) o++;
        c.o = o;
      }
    });
    S.deck = deck;
  }else if(g.eng === "quiz"){
    S.deck = shuffle(g.qs.slice()).slice(0, S.rounds).map(([q,opts]) => ({q, opts: shuffle(opts.map((t,i) => ({t, ok:i===0})))}));
  }else{
    S.deck = shuffle(g.qs.slice()).slice(0, S.rounds);
    S.m = {step:0, ans:[null,null], hits:0, guess:[0,0], asked:[0,0]};
  }
  S.screen = "play";
}

/* ---------- Общи части ---------- */
function topBar(total){
  const g = game();
  return `<div class="stack">
    <div class="top">
      <button class="btn ghost small" data-act="quit">Край</button>
      <span class="count">${S.i+1} от ${total}</span>
      ${g.eng==="match" ? `<span style="width:64px"></span>` : `<button class="btn ghost small" data-act="sheet">Точки</button>`}
    </div>
    <div class="bar"><i style="width:${Math.round(S.i/total*100)}%"></i></div>
  </div>`;
}
function fill(t, c){
  const g = game();
  return h(t).replace(/\{o\}/g, `<u>${h(S.players[c.o] ?? "")}</u>`).replace(/\{h\}/g, `<u>${h(S.players[0])}</u>`);
}

/* ---------- Карти ---------- */
function viewCards(){
  const g = game(), c = S.deck[S.i], k = KIND[c.k];
  const pen = g.drinkOpt && S.drink;
  const group = c.k==="A" || c.k==="V" || c.k==="G";
  const text = fill(c.t, c);
  let body, rule, actions;
  if(c.k==="A"){ body = `<p class="q">${text}</p>`; rule = g.ruleA || ("Който го е правил, си признава. Маркирайте всички признали." + (pen ? " Те отпиват по глътка." : "")); }
  else if(c.k==="V"){ body = `<p class="lead">${h(g.lead)}</p><p class="q">…${text}</p>`; rule = g.ruleV || ("Бройте до три и посочете едновременно. Маркирайте избрания." + (pen ? " Той отпива глътка." : "")); }
  else if(c.k==="G"){ body = `<p class="q">${text}</p>`; rule = `Всички казват предположенията си, после ${h(S.players[0])} разкрива истината. Маркирайте кой позна.`; }
  else if(c.k==="Q"){ body = `<p class="who">Въпрос към <b>${h(S.players[c.p])}</b></p><p class="q">${text}</p>`; rule = pen ? "Отговорът носи 1 точка. Пас означава една глътка." : "Отговорът носи 1 точка. Пасът не носи нищо."; }
  else { body = `<p class="who">Задача за <b>${h(S.players[c.p])}</b></p><p class="q">${text}</p>`; rule = "Изпълнената задача носи 2 точки. Ако включва друг човек, той може да откаже." + (pen ? " Пас означава една глътка." : ""); }
  if(group){
    const ask = c.k==="A" ? (g.askA || "Кой си призна?") : c.k==="V" ? "Кого посочихте?" : "Кой позна?";
    actions = `<div class="stack"><h2>${ask}</h2>
      <div class="pick">${S.players.map((p,i) => (c.k==="G" && g.hero && i===0) ? "" :
        `<button data-act="pick" data-i="${i}" aria-pressed="${S.sel.includes(i)}">${h(p)}</button>`).join("")}</div></div>
      <button class="btn" data-act="next">${S.sel.length ? "Запиши и напред" : "Никой, напред"}</button>`;
  }else{
    actions = `<div class="row"><button class="btn ghost" data-act="pass">Пас</button>
      <button class="btn" data-act="done">${c.k==="Q" ? "Отговорих" : "Изпълнено"}</button></div>`;
  }
  return `${topBar(S.deck.length)}
  <div class="deck"><article class="card c-${k.c}"><span class="tag">${g.tags?.[c.k] || k.tag}</span>${c.l ? `<span class="heat" role="img" aria-label="Ниво ${c.l} от 3">${[1,2,3].map(n => `<i class="${n<=c.l ? "on" : ""}"></i>`).join("")}</span>` : ""}${body}<p class="rule">${rule}</p></article></div>
  <p class="flash" aria-live="polite">${h(S.flash)}</p>
  ${actions}${S.sheet ? viewSheet() : ""}`;
}

  <div class="opts">${c.opts.map((o,i) => `<button class="opt ${done ? (o.ok ? "ok" : i===S.picked ? "bad" : "") : ""}"
      data-act="q-pick" data-i="${i}" ${done ? "disabled" : ""}>${h(o.t)}</button>`).join("")}</div>
  <p class="flash" aria-live="polite">${done ? (c.opts[S.picked].ok ? "Вярно! +1 точка" : `Верният отговор е ${h(right)}`) : ""}</p>
  ${done ? `<button class="btn" data-act="q-next">Напред</button>` : ""}
  ${S.sheet ? viewSheet() : ""}`;
}

/* ---------- За двама ---------- */
function matchInfo(){
  const q = S.deck[S.i], about = Array.isArray(q) && q.length===3, same = Array.isArray(q) && q.length===2;
  const subj = about ? S.i % 2 : 0;
  const order = about ? [subj, 1-subj] : [0,1];
  const opts = about ? q[2] : same ? q[1] : [S.players[0], S.players[1]];
  const neutral = about ? q[1].replace("{n}", S.players[subj]) : same ? q[0] : "Кой от двамата " + q;
  return {q, about, subj, order, opts, neutral};
}
function viewMatch(){
  const g = game(), m = S.m, I = matchInfo();
  const bar = topBar(S.deck.length);
  if(m.step===0 || m.step===2){
    const who = I.order[m.step/2];
    return `${bar}<section class="cover">
      <p class="note">Подайте телефона на</p><b>${h(S.players[who])}</b>
      <p class="note">${m.step===2 ? "Другият не гледа екрана." : I.about ? (who===I.subj ? "Отговаряш за себе си." : "Познаваш отговора на другия.") : "Отговаряте един след друг."}</p>
      <button class="btn" data-act="m-ready">Телефонът е у мен</button></section>`;
  }
  if(m.step===1 || m.step===3){
    const who = I.order[(m.step-1)/2];
    const prompt = I.about ? (who===I.subj ? I.q[0] : I.q[1].replace("{n}", S.players[I.subj])) : I.neutral;
    return `${bar}
    <div class="deck"><article class="card c-${g.c}"><span class="tag">${g.cat}</span>
      <p class="who">Отговаря <b>${h(S.players[who])}</b></p><p class="q">${h(prompt)}</p></article></div>
    <div class="opts">${I.opts.map((o,i) => `<button class="opt" data-act="m-pick" data-i="${i}">${h(o)}</button>`).join("")}</div>`;
  }
  const same = m.ans[0] === m.ans[1];
  return `${bar}
  <div class="deck"><article class="card c-${g.c}"><span class="tag">${g.cat}</span>
    <p class="q">${h(I.neutral)}</p>
    <div class="ans"><span>${h(S.players[I.order[0]])}</span><b>${h(I.opts[m.ans[0]])}</b></div>
    <div class="ans"><span>${h(S.players[I.order[1]])}</span><b>${h(I.opts[m.ans[1]])}</b></div>
    <p class="verdict" style="color:${same ? "#1E7F6B" : "#B12A29"}">${same ? "Съвпадение" : "Разминаване"}</p>
  </article></div>
  <button class="btn" data-act="m-next">Напред</button>`;
}

/* ---------- Точки и край ---------- */
function scoreTable(){
  const g = game();
  const rows = S.players.map((p,i) => ({p, ...S.stats[i]})).sort((x,y) => (y.a+y.b)-(x.a+x.b));
  if(g.eng==="quiz") return `<table><thead><tr><th>Играч</th><th>Верни</th></tr></thead>
    <tbody>${rows.map(r => `<tr><td>${h(r.p)}</td><td>${r.b}</td></tr>`).join("")}</tbody></table>`;
  return `<table><thead><tr><th>Играч</th><th>Посочван</th><th>Точки</th><th>Пас</th></tr></thead>
    <tbody>${rows.map(r => `<tr><td>${h(r.p)}</td><td>${r.a}</td><td>${r.b}</td><td>${r.pass}</td></tr>`).join("")}</tbody></table>`;
}
function viewSheet(){
  return `<div class="sheet" data-act="sheet-close"><div role="dialog" aria-label="Точки">
    <h1 style="font-size:24px">Точки дотук</h1>${scoreTable()}
    <button class="btn" data-act="sheet-close">Обратно към играта</button></div></div>`;
}
function topBy(key){
  let best = 0, who = [];
  S.stats.forEach((s,i) => { if(s[key] > best){ best = s[key]; who = [i]; } else if(s[key] === best && best > 0) who.push(i); });
  return best > 0 ? {names: who.map(i => S.players[i]).join(" и "), n: best} : null;
}
function summary(){
  const g = game();
  if(g.eng==="match"){
    const m = S.m, played = m.played || 0;
    const pct = played ? Math.round(m.hits/played*100) : 0;
    const tier = pct>=85 ? "Един ум в две тела" : pct>=65 ? "Силен отбор" : pct>=40 ? "Има за какво да си говорите" : "Противоположностите се привличат";
    const rows = [];
    if(S.deck.some(q => Array.isArray(q) && q.length===3)){
      rows.push([`${S.players[0]} позна`, `${m.guess[0]} от ${m.asked[0]}`], [`${S.players[1]} позна`, `${m.guess[1]} от ${m.asked[1]}`]);
      if(m.guess[0] !== m.guess[1]) rows.push(["По-добре познава другия", S.players[m.guess[0] > m.guess[1] ? 0 : 1]]);
    }else rows.push(["Съвпадения", `${m.hits} от ${played}`]);
    return {big:`${pct}%`, title:tier, rows};
  }
  if(g.eng==="quiz"){
    const t = topBy("b"), n = S.players.length;
    const rows = t ? [[n>1 ? "Победител" : "Резултат", n>1 ? `${t.names} (${t.n})` : `${t.n} от ${S.answered || S.deck.length} верни`]] : [];
    return {title: t ? "Крайно класиране" : "Нито един верен отговор", rows};
  }
  const rows = [];
  const a = topBy("a"), b = topBy("b"), p = topBy("pass");
  if(a && g.aw[0]) rows.push([g.aw[0], a.names]);
  if(b && g.aw[1]) rows.push([g.aw[1], b.names]);
  if(g.aw[2]){
    const least = Math.min(...S.stats.map(x => x.a));
    const who = S.players.filter((_,i) => S.stats[i].a === least);
    if(who.length < S.players.length) rows.push([g.aw[2], who.join(" и ")]);
  }
  if(p) rows.push(["Крал на паса", p.names]);
  return {title:"Равносметката", rows};
}
function shareText(){
  const g = game(), s = summary();
  const lines = s.rows.map(([k,v]) => `${k}: ${v}`).join("\n");
  return `${g.name} · игра от Meivi\n${s.big ? s.big + " съвпадение. " : ""}${s.title}\n${lines}\nИграй и ти: meivi.bg`;
}
function viewEnd(){
  const g = game(), s = summary(), n = S.players.length;
  let rows = s.rows.slice(), hero;
  if(s.big){
    hero = `<div class="ring" style="--p:${parseInt(s.big, 10)}"><b>${s.big}</b><span>съвпадение</span></div>
      <p class="ptitle">${h(s.title)}</p>
      <p class="pnames">${h(S.players[0])} <i>и</i> ${h(S.players[1])}</p>`;
  }else if(g.eng==="quiz" && n > 1 && rows.length){
    const top3 = S.players.map((p,i) => ({p, b:S.stats[i].b})).sort((x,y) => y.b - x.b).slice(0,3);
    const slot = (r, cls) => r ? `<div class="p ${cls}">${cls==="p1" ? `<span class="cr" aria-hidden="true">👑</span>` : ""}<span class="pn">${h(r.p)}</span><i>${r.b}</i></div>` : "";
    hero = `<p class="plabel">Крайно класиране</p><div class="podium">${slot(top3[1],"p2")}${slot(top3[0],"p1")}${slot(top3[2],"p3")}</div>`;
    rows = [];
  }else if(rows.length){
    const [k,v] = rows.shift();
    hero = `<p class="plabel">${h(k)}</p><p class="pname${String(v).length > 12 ? " long" : ""}">${h(v)}</p>`;
  }else{
    hero = `<p class="pname long">${h(s.title)}</p>`;
  }
  let rank = "";
  if(g.eng !== "match" && (g.eng !== "quiz" || n > 3)){
    const list = S.players.map((p,i) => ({p, ...S.stats[i]})).sort((x,y) => (y.a+y.b)-(x.a+x.b));
    let cols = g.eng==="quiz" ? [["Верни","b"]] : [["Посочван","a"],["Точки","b"],["Пас","pass"]].filter(([,k]) => list.some(r => r[k] > 0));
    if(!cols.length) cols = [["Точки","b"]];
    rank = `<div class="prank" style="--c:${cols.length}">
      <div class="pr ph"><span>Класиране</span>${cols.map(([t]) => `<span>${t}</span>`).join("")}</div>
      ${list.map((r,i) => `<div class="pr"><span><i>${i+1}</i>${h(r.p)}</span>${cols.map(([,k]) => `<span>${r[k]}</span>`).join("")}</div>`).join("")}
    </div>`;
  }
  return `
  <section class="poster c-${g.c}">
    <div class="phead"><span class="plogo"><img class="logo" src="logo-ink.png" alt="Meivi"></span><span>Дигитални игри</span></div>
    <p class="pgame"><span aria-hidden="true">${ICON[g.id] || "🎲"}</span>${g.name}</p>
    <div class="phero">${hero}</div>
    ${rows.length ? `<div class="pchips">${rows.map(([k,v]) => `<div><span>${h(k)}</span><b>${h(v)}</b></div>`).join("")}</div>` : ""}
    ${rank}
    <p class="pfoot">Играй и ти на <b>meivi.bg</b></p>
  </section>
  <div class="stack">
    <button class="btn" data-act="copy">${S.copied ? "Копирано" : "Копирай резултата за споделяне"}</button>
    <div class="row"><button class="btn ghost" data-act="again">Играй пак</button><button class="btn ghost" data-act="home">Всички игри</button></div>
    <p class="note" style="text-align:center">Направи снимка на картата и я пусни в стори.</p>
  </div>`;
}

function render(){
  let v;
  if(S.screen==="home" || !game()) v = viewHome();
  else if(S.screen==="setup") v = viewSetup();
  else if(S.screen==="end") v = viewEnd();
  else v = {cards:viewCards, quiz:viewQuiz, match:viewMatch}[game().eng]();
  app.innerHTML = v;
  app.querySelector?.(".card")?.style.setProperty("--tilt", (S.i % 2 ? 1.3 : -1.3) + "deg");
  const key = S.screen + ":" + S.g + ":" + S.i + ":" + (S.m ? S.m.step : "");
  if(key === lastKey) app.querySelector?.(".deck")?.classList.add("still");
  lastKey = key;
  if(fx){ fx = false; confetti(); }
}

/* ---------- Действия ---------- */
let busy = false, fx = false, lastKey = "";
const calm = () => !!window.matchMedia?.("(prefers-reduced-motion: reduce)")?.matches;
function confetti(){
  if(!document.body || calm()) return;
  const box = document.createElement("div"); box.className = "fx";
  const cols = ["#B12A29","#EF8F61","#1E7F6B","#6B4FB3","#1F6FB5","#F7C948"];
  for(let n=0; n<26; n++){
    const i = document.createElement("i");
    i.style.cssText = `left:${38+Math.random()*24}%;background:${cols[n%cols.length]};--x:${(Math.random()*2-1)*44}vw;--y:${-(18+Math.random()*40)}vh;--r:${Math.random()*720-360}deg;animation-delay:${Math.random()*.12}s`;
    box.append(i);
  }
  document.body.append(box);
  setTimeout(() => box.remove(), 1400);
}
function advance(){
  const go = () => {
    busy = false;
    S.sel = []; S.picked = null;
    if(S.i + 1 >= S.deck.length){ S.screen = "end"; S.flash = ""; S.copied = false; fx = true; }
    else S.i++;
    render(); window.scrollTo(0,0);
  };
  const el = document.querySelector?.(".card");
  if(el && !calm()){ busy = true; el.classList.add("out"); setTimeout(go, 190); }
  else go();
}
app.addEventListener("submit", e => {
  e.preventDefault();
  const inp = document.getElementById("newName"), name = inp.value.trim();
  if(name && S.players.length < (game() ? game().n[1] : 12)){ S.players.push(name); saveNames(); render(); document.getElementById("newName")?.focus(); }
});
app.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if(!b || busy) return;
  const act = b.dataset.act;
  if(act==="sheet-close" && b.classList.contains("sheet") && e.target !== b) return;
  switch(act){
    case "cat": document.getElementById("cat-" + b.dataset.i)?.scrollIntoView?.({behavior: calm() ? "auto" : "smooth", block:"start"}); return;
    case "open": S.g = b.dataset.g; S.screen = "setup"; window.scrollTo(0,0); break;
    case "home": S.screen = "home"; S.g = null; window.scrollTo(0,0); break;
    case "rounds": S.rounds = +b.dataset.v; break;
    case "level": S.level = +b.dataset.v; break;
    case "kind": S.kinds[b.dataset.k] = !S.kinds[b.dataset.k]; break;
    case "drink": S.drink = b.dataset.v==="1"; break;
    case "del": S.players.splice(+b.dataset.i,1); saveNames(); break;
    case "front": { const i = +b.dataset.i; S.players.unshift(S.players.splice(i,1)[0]); saveNames(); break; }
    case "start": case "again": begin(); window.scrollTo(0,0); break;
    case "pick": { const i = +b.dataset.i, k = S.sel.indexOf(i); if(k>=0) S.sel.splice(k,1); else S.sel.push(i); break; }
    case "next": {
      const c = S.deck[S.i], key = c.k==="G" ? "b" : "a";
      S.sel.forEach(i => S.stats[i][key]++);
      const names = S.sel.map(i => S.players[i]).join(", ");
      S.flash = names ? (c.k==="G" ? `Познаха: ${names}` : `Отбелязани: ${names}`) : "";
      return advance();
    }
    case "done": { const c = S.deck[S.i], pts = c.k==="D" ? 2 : 1; S.stats[c.p].b += pts; S.flash = `${S.players[c.p]}: +${pts}`; return advance(); }
    case "pass": { const c = S.deck[S.i]; S.stats[c.p].pass++; S.flash = `${S.players[c.p]} каза пас`; return advance(); }
    case "q-pick": {
      if(S.picked !== null) return;
      S.picked = +b.dataset.i;
      S.answered = (S.answered||0) + 1;
      if(S.deck[S.i].opts[S.picked].ok){ S.stats[S.i % S.players.length].b++; fx = true; }
      break;
    }
    case "q-next": return advance();
    case "m-ready": S.m.step++; break;
    case "m-pick": {
      const m = S.m, I = matchInfo();
      m.ans[(m.step-1)/2] = +b.dataset.i; m.step++;
      if(m.step === 4){
        const same = m.ans[0] === m.ans[1];
        m.played = (m.played||0) + 1;
        if(same){ m.hits++; fx = true; }
        if(I.about){ const guesser = 1 - I.subj; m.asked[guesser]++; if(same) m.guess[guesser]++; }
      }
      break;
    }
    case "m-next": S.m.step = 0; S.m.ans = [null,null]; return advance();
    case "sheet": S.sheet = true; break;
    case "sheet-close": S.sheet = false; break;
    case "quit": S.screen = "end"; S.sheet = false; S.copied = false; fx = true; break;
    case "copy":
      navigator.clipboard.writeText(shareText()).then(() => { S.copied = true; render(); }).catch(() => {});
      return;
  }
  render();
});

/* ---------- Старт ---------- */
function start(saved){
  if(saved && saved.screen) S = Object.assign(S, saved); else loadNames();
  render();
}
window.addEventListener("error", e => { if(!app.innerHTML) app.textContent = "Грешка при зареждане: " + e.message; });
loadNames();
try{ render(); }catch(e){ app.textContent = "Грешка при зареждане: " + e.message; }
try{
  window.claude?.hot?.snapshot?.(() => S);
  window.claude?.hot?.ready?.(d => { try{ if(d && d.screen && Array.isArray(d.players)){ S = Object.assign(S, d); render(); } }catch(e){} });
}catch(e){}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Проба на входа · Meivi</title>
<style>
  body{margin:0;background:#FBF1F0;color:#1F1F1F;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{max-width:480px;margin:0 auto;padding:28px 18px 40px;display:flex;flex-direction:column;gap:16px}
  h1{font-size:24px;margin:0}
  p{margin:0}
  .note{color:#7A6767;font-size:14px}
  button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:15px 22px;min-height:54px;color:#fff;background:#B12A29;cursor:pointer}
  button.ghost{background:#fff;color:#1F1F1F;box-shadow:0 2px 8px rgba(122,40,38,.12)}
  .box{background:#fff;border-radius:20px;padding:14px 16px;box-shadow:0 2px 8px rgba(122,40,38,.08);display:flex;flex-direction:column;gap:8px}
  .box b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#7A6767}
  .ok{color:#1E7F6B;font-weight:700}
  .bad{color:#B12A29;font-weight:700}
  pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:12.5px;color:#4A3D3D}
</style>
</head>
<body>
<main>
  <h1>Проба на входа</h1>
  <p class="note">Скрита страница за проба: вход с профила от магазина Meivi. Не е част от игрите.</p>
  <div id="out"></div>
</main>
<script>
/* A throwaway page that tries the store's own sign-in (Shopify customer accounts) from this address.
   It is a "public client": no secret is kept here, the sign-in is protected by a one-time proof (PKCE).
   SHOP is the number of the store, CLIENT is the id the Headless channel gives for this site. */
const SHOP = "111310799180";
const CLIENT = "17260a06-03bc-4073-be38-bb5af6b68aaa";
const AUTH = "https://shopify.com/authentication/" + SHOP;
const API = "https://shopify.com/" + SHOP + "/account/customer/api/2026-10/graphql";
const HERE = location.origin + location.pathname;
const out = document.getElementById("out");
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mem = { get: k => { try { return sessionStorage.getItem("meivi.vhod." + k); } catch (e) { return null; } },
              set: (k, v) => { try { if (v == null) sessionStorage.removeItem("meivi.vhod." + k); else sessionStorage.setItem("meivi.vhod." + k, v); } catch (e) {} } };
const b64url = bytes => btoa(String.fromCharCode.apply(null, new Uint8Array(bytes))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const random = n => b64url(crypto.getRandomValues(new Uint8Array(n)));
const claims = jwt => { try { return JSON.parse(decodeURIComponent(escape(atob(jwt.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))))); } catch (e) { return {}; } };

async function signIn() {
  const verifier = random(48), state = random(16), nonce = random(16);
  const challenge = b64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
  mem.set("verifier", verifier); mem.set("state", state); mem.set("nonce", nonce);
  const q = new URLSearchParams({ client_id: CLIENT, response_type: "code", redirect_uri: HERE, scope: "openid email customer-account-api:full",
    state, nonce, code_challenge: challenge, code_challenge_method: "S256", locale: "bg" });
  location.assign(AUTH + "/oauth/authorize?" + q);
}
function signOut() {
  const id = mem.get("id");
  ["access", "id", "refresh"].forEach(k => mem.set(k, null));
  if (id) location.assign(AUTH + "/logout?" + new URLSearchParams({ id_token_hint: id, post_logout_redirect_uri: HERE })); else show();
}
/* Coming back from the store's sign-in page with a one-time code: swap it for the tokens. */
async function finish(code, state) {
  if (state !== mem.get("state")) throw new Error("Връщането не съвпада със започнатия вход (state).");
  const r = await fetch(AUTH + "/oauth/token", { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: new URLSearchParams({ grant_type: "authorization_code", client_id: CLIENT, redirect_uri: HERE, code, code_verifier: mem.get("verifier") || "" }) });
  const text = await r.text(); let d = {}; try { d = JSON.parse(text); } catch (e) {}
  if (!r.ok || !d.access_token) throw new Error("Магазинът не издаде достъп (" + r.status + "): " + text.slice(0, 400));
  mem.set("access", d.access_token); mem.set("id", d.id_token || ""); mem.set("refresh", d.refresh_token ? "да" : "не");
  ["verifier", "state", "nonce"].forEach(k => mem.set(k, null));
}
async function customer() {
  const r = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json", Authorization: mem.get("access") },
    body: JSON.stringify({ query: "{ customer { id firstName lastName emailAddress { emailAddress } orders(first: 5) { nodes { name processedAt } } } }" }) });
  const text = await r.text(); let d = {}; try { d = JSON.parse(text); } catch (e) {}
  if (!r.ok || !d.data || !d.data.customer) throw new Error("Профилът не се прочете (" + r.status + "): " + text.slice(0, 400));
  return d.data.customer;
}
function show(problem, who) {
  const signed = !!mem.get("access"), c = claims(mem.get("id") || "");
  out.innerHTML = (!CLIENT ? `<p class="box bad">Страницата още не е свързана с магазина (липсва номерът от канала Headless).</p>` : "")
    + (problem ? `<div class="box"><b>Проблем</b><p class="bad">${esc(problem)}</p></div>` : "")
    + (signed ? `<div class="box"><b>Входът работи</b><p class="ok">Влезе като ${esc(c.email || (who && who.emailAddress && who.emailAddress.emailAddress) || "?")}</p>
        <pre>Потвърден имейл: ${esc(c.email_verified)}\nНомер на клиента: ${esc(who ? who.id : "(не е прочетен)")}\nИме: ${esc(who ? [who.firstName, who.lastName].filter(Boolean).join(" ") || "(няма)" : "(не е прочетено)")}\nПоръчки (до 5): ${esc(who ? (who.orders.nodes.map(o => o.name).join(", ") || "няма") : "(не са прочетени)")}\nДълъг достъп (refresh): ${esc(mem.get("refresh"))}</pre></div>
        <button class="ghost" id="bye">Изход</button>`
      : `<button id="go" ${CLIENT ? "" : "disabled"}>Вход с профила от Meivi</button>`);
  const go = document.getElementById("go"), bye = document.getElementById("bye");
  if (go) go.onclick = () => signIn().catch(e => show(e.message));
  if (bye) bye.onclick = signOut;
}
(async function () {
  const p = new URLSearchParams(location.search);
  try {
    if (p.get("error")) throw new Error(p.get("error") + ": " + (p.get("error_description") || ""));
    if (p.get("code")) { await finish(p.get("code"), p.get("state")); history.replaceState(null, "", HERE); }
    else if (p.toString()) history.replaceState(null, "", HERE);
    show(null, mem.get("access") ? await customer() : null);
  } catch (e) { history.replaceState(null, "", HERE); show(e.message); }
})();
</script>
</body>
</html>
